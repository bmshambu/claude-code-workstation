<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Proposal Builder</title>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
    <style>
        body { font-family: "Segoe UI", sans-serif; font-size: 13px; margin: 12px; }
        h1 { font-size: 16px; margin: 0 0 4px; }
        p { margin: 4px 0 12px; color: #555; }
        button { display: block; width: 100%; margin: 6px 0; padding: 7px; font-size: 13px; cursor: pointer; }
        pre { background: #f3f3f3; padding: 8px; white-space: pre-wrap; font-size: 12px; min-height: 60px; }
    </style>
</head>

<body>
    <h1>Proposal Builder</h1>
    <p>Hello-world test. Each button checks one thing the real add-in will need.</p>

    <button id="hello">1. Say hello into the selected text box</button>
    <button id="tag">2. Tag the selected slide as block "cover"</button>
    <button id="list">3. List every slide and its tags</button>
    <button id="newdeck">4. Open a new presentation</button>

    <pre id="log">Waiting for PowerPoint...</pre>
</body>

<script>
    const log = (msg) => { document.getElementById("log").textContent = msg; };
    const fail = (err) => log("Error: " + (err && err.message ? err.message : err));

    Office.onReady((info) => {
        if (info.host !== Office.HostType.PowerPoint) {
            log("Not running in PowerPoint (host: " + info.host + ").");
            return;
        }
        // Which PowerPoint API versions this copy of PowerPoint supports.
        // Tags need 1.3, reading the selected slide needs 1.5.
        const sets = ["1.1", "1.3", "1.5", "1.8"].map(
            (v) => v + ": " + (Office.context.requirements.isSetSupported("PowerPointApi", v) ? "yes" : "no")
        );
        log("Ready.\nPowerPointApi support\n" + sets.join("\n"));

        document.getElementById("hello").onclick = () => sayHello().catch(fail);
        document.getElementById("tag").onclick = () => tagSlide().catch(fail);
        document.getElementById("list").onclick = () => listSlides().catch(fail);
        document.getElementById("newdeck").onclick = () => newDeck().catch(fail);
    });

    // 1. Writes into whatever text is selected. Click into a text box first.
    async function sayHello() {
        const options = { coercionType: Office.CoercionType.Text };
        await new Promise((resolve, reject) =>
            Office.context.document.setSelectedDataAsync("Hello world!", options, (r) =>
                r.status === Office.AsyncResultStatus.Succeeded ? resolve() : reject(r.error)
            )
        );
        log("Inserted 'Hello world!' into the selection.");
    }

    // 2. The plan stores each slide's block id as a slide tag, so it survives
    // reordering and retitling. This proves a tag can be written and read back.
    async function tagSlide() {
        await PowerPoint.run(async (context) => {
            const slides = context.presentation.getSelectedSlides();
            slides.load("items");
            await context.sync();
            if (slides.items.length === 0) {
                log("Select a slide in the thumbnail pane first.");
                return;
            }
            const slide = slides.items[0];
            slide.tags.add("BLOCK", "cover");
            await context.sync();
            const tag = slide.tags.getItem("BLOCK");
            tag.load("value");
            await context.sync();
            log("Tagged slide " + slide.id + "\nBLOCK = " + tag.value);
        });
    }

    // 3. What the engine would read: every slide in order with its tags.
    async function listSlides() {
        await PowerPoint.run(async (context) => {
            const slides = context.presentation.slides;
            slides.load("items/id");
            await context.sync();
            const tagLists = slides.items.map((s) => {
                s.tags.load("items/key,items/value");
                return s.tags;
            });
            await context.sync();
            const lines = slides.items.map((s, i) => {
                const tags = tagLists[i].items.map((t) => t.key + "=" + t.value).join(", ");
                return "Slide " + (i + 1) + ": " + (tags || "(no tags)");
            });
            log(slides.items.length + " slide(s)\n" + lines.join("\n"));
        });
    }

    // 4. The built deck will open this way, filled, as the preview.
    // With no argument it opens a blank presentation.
    async function newDeck() {
        await PowerPoint.createPresentation();
        log("Asked PowerPoint to open a new presentation.");
    }
</script>

</html>
